<section class="auth-page">
  <div class="auth-card">
    <p class="auth-eyebrow">Lumina System</p>
    <h1>Crear cuenta</h1>
    <p class="auth-subtitle">Regístrate para comprar y acceder a tus cursos.</p>

    @if (errorMessage()) {
      <div class="auth-error">
        {{ errorMessage() }}
      </div>
    }

    @if (successMessage()) {
      <div class="auth-success">
        {{ successMessage() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="auth-form">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" [(ngModel)]="nombre" required />
      </div>

      <div class="form-group">
        <label for="apellidos">Apellidos</label>
        <input id="apellidos" name="apellidos" type="text" [(ngModel)]="apellidos" required />
      </div>

      <div class="form-group">
        <label for="correo">Correo</label>
        <input id="correo" name="correo" type="email" [(ngModel)]="correo" required />
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input id="telefono" name="telefono" type="text" [(ngModel)]="telefono" required />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" [(ngModel)]="password" required />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          required
        />
      </div>

      <button type="submit" [disabled]="loading()">
        @if (!loading()) {
          <span>Crear cuenta</span>
        } @else {
          <span>Registrando...</span>
        }
      </button>
    </form>

    <p class="auth-footer">
      ¿Ya tienes cuenta?
      <a routerLink="/login">Iniciar sesión</a>
    </p>
  </div>
</section>
