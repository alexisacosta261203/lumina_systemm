<header class="header">
  <div class="brand">
    <h2>Lumina System</h2>
    <p>Venta de cursos de fotografia</p>
  </div>

  <nav class="nav">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Inicio
    </a>

    <a routerLink="/cursos" routerLinkActive="active">
      Cursos
    </a>

    <a routerLink="/contacto" routerLinkActive="active">
      Contacto
    </a>

    @if (!isAuthenticated()) {
      <a routerLink="/login" routerLinkActive="active">
        Login
      </a>

      <a routerLink="/registro" routerLinkActive="active">
        Registro
      </a>
    }

    @if (isAuthenticated()) {
      <span class="user-badge">
        {{ user()?.nombre }} ({{ user()?.role }})
      </span>

      @if (isAdmin()) {
        <a routerLink="/admin/cursos" routerLinkActive="active">
          Admin Cursos
        </a>
      }

      <button type="button" class="logout-btn" (click)="logout()">
        Cerrar sesion
      </button>
    }
  </nav>
</header>
